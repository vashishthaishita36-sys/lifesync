{% extends "base.html" %}
{% block content %}
<h2 class="page-title">Log your day</h2>
<p class="muted">Fill in the facts as they happened. Rate productivity at the end of the day.</p>

<form method="POST" class="panel">
    <div class="form-grid">
        <label class="field">Date
            <input type="date" name="entry_date" value="{{ today }}" required></label>
        <label class="field">Bedtime
            <input type="time" name="bedtime" required></label>
        <label class="field">Sleep hours
            <input type="number" name="sleep_hours" step="0.5" min="0" max="24" required></label>
        <label class="field">Study / work hours
            <input type="number" name="study_hours" step="0.5" min="0" max="24" required></label>
        <label class="field">Tasks planned
            <input type="number" name="tasks_planned" min="0" required></label>
        <label class="field">Tasks completed
            <input type="number" name="tasks_completed" min="0" required></label>
        <label class="field">Exercise (minutes)
            <input type="number" name="exercise_minutes" min="0" required></label>
        <label class="field">Screen time (hours)
            <input type="number" name="screen_hours" step="0.5" min="0" max="24" required></label>
        <label class="field">Spending today (&#8377;)
            <input type="number" name="spending" step="0.01" min="0" required></label>
        <label class="field">Productivity (1-10)
            <input type="number" name="productivity_score" min="1" max="10" required></label>
    </div>
    <button type="submit" class="btn full">Save entry</button>
</form>
{% endblock %}
